apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-dev
  namespace: argocd
spec:
  project: lab
  source:
    repoURL: https://github.com/rogeriocastro-sre/k8s-lab-gitops.git
    targetRevision: main
    path: apps/hello/envs/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: hello-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
