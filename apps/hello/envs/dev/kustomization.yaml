# Tag atualizada automaticamente pelo job deploy-dev do k8s-lab-app
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hello-dev
resources:
  - ../../base
images:
  - name: hello
    newName: ghcr.io/rogeriocastro-sre/k8s-lab-app
    newTag: PENDENTE
patches:
  - target:
      kind: HTTPRoute
      name: hello
    patch: |-
      - op: replace
        path: /spec/hostnames
        value: ["hello-dev.k3s.lab"]
